<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Médica - Control de Citas</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Agenda Médica">
    <meta name="theme-color" content="#f8fafc">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media (max-width: 639px) {
        .tabla-responsive thead { display: none; }
        .tabla-responsive tbody tr {
          display: block; margin-bottom: 0.6rem; background-color: #ffffff;
          border: 1px solid #e2e8f0; border-radius: 0.375rem; padding: 0.5rem;
        }
        .tabla-responsive tbody td {
          display: flex; justify-content: space-between; align-items: center; padding: 0.25rem 0; border: none; text-align: right;
        }
        .tabla-responsive tbody td::before {
          content: attr(data-label); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; color: #64748b; text-align: left;
        }
        .tabla-responsive tbody td.td-acciones {
          justify-content: flex-end; border-top: 1px solid #f1f5f9; margin-top: 0.35rem; padding-top: 0.4rem;
        }
      }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen antialiased text-slate-800 text-sm">

    <div class="max-w-5xl mx-auto p-2 sm:p-4">
        <!-- Encabezado Compacto -->
        <header class="mb-3 border-b pb-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-800">Control de Agenda Médica</h1>
                <p class="text-xs text-slate-500">Gestión institucional de citas y pacientes</p>
            </div>
            <div id="statusBadge" class="text-[11px] bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full font-medium">
                Conectando...
            </div>
        </header>

        <!-- Formulario Compacto -->
        <div class="bg-white rounded-lg shadow-sm p-3 sm:p-4 mb-3 border border-slate-200/60">
            <div class="flex justify-between items-center mb-2">
                <h2 id="formTitulo" class="text-sm sm:text-base font-semibold text-slate-700">Agendar Nueva Cita</h2>
                <button id="btnCancelarEdicion" onclick="cancelarEdicion()" class="hidden text-xs bg-slate-200 text-slate-700 hover:bg-slate-300 px-2.5 py-1 rounded font-medium">
                    Cancelar
                </button>
            </div>
            
            <form id="citaForm" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5">
                <input type="hidden" id="editId" value="">
                <input type="hidden" id="anio" value="2026">

                <!-- Nombre del Paciente -->
                <div class="sm:col-span-2">
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Nombre del Paciente</label>
                    <input type="text" id="paciente" required class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none uppercase" placeholder="EJ. JOSE ALFREDO JIMENEZ">
                </div>

                <!-- DUI -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">DUI (00000000-0)</label>
                    <input type="text" id="dui" maxlength="10" placeholder="02043231-6" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none">
                </div>

                <!-- Teléfono -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Teléfono (8 dígitos)</label>
                    <input type="tel" id="telefono" maxlength="8" placeholder="74803608" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none">
                </div>

                <!-- N° de Registro -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">N° Registro (XXXXX-AAAA)</label>
                    <input type="text" id="registro" placeholder="40093-2026" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none">
                </div>

                <!-- Doctor Asignado -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Doctor Asignado</label>
                    <select id="doctor" required class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none bg-white">
                        <option value="">Seleccione Doctor...</option>
                        <option value="Dr. Reyes">Dr. Reyes</option>
                        <option value="Dra. Molina">Dra. Molina</option>
                        <option value="Dr. Gonzalez">Dr. Gonzalez</option>
                        <option value="Dr. Avalos">Dr. Avalos</option>
                        <option value="Dr. Hurtarte">Dr. Hurtarte</option>
                        <option value="Dra. Flores">Dra. Flores</option>
                        <option value="Dr. Mendoza">Dr. Mendoza</option>
                    </select>
                </div>

                <!-- Fecha -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Fecha de Cita</label>
                    <input type="date" id="fecha" required class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none bg-white">
                    <p id="msgFecha" class="text-[10px] mt-0.5 font-semibold hidden"></p>
                </div>

                <!-- Estado -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Estado</label>
                    <select id="estado" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none bg-white">
                        <option value="Agendado">Agendado</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Atendido">Atendido</option>
                    </select>
                </div>

                <!-- Botón Guardar -->
                <div class="sm:col-span-2 md:col-span-4 mt-1">
                    <button type="submit" id="btnGuardar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 rounded text-xs transition duration-200 active:scale-[0.99]">
                        Guardar Cita
                    </button>
                </div>
            </form>
        </div>

        <!-- SECCIÓN DE CITAS Y FILTROS INTEGRADOS -->
        <div class="bg-transparent sm:bg-white rounded-lg sm:shadow-sm sm:p-4 sm:border sm:border-slate-200/60">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 gap-2 px-1 sm:px-0">
                <div class="flex items-center space-x-1.5">
                    <span class="text-blue-600 font-bold text-xs">🔍</span>
                    <h2 class="text-xs sm:text-sm font-semibold text-slate-700">Citas Registradas y Filtros</h2>
                </div>
                <span id="contadorCitas" class="text-[11px] font-semibold text-slate-600 bg-white sm:bg-slate-100 px-2.5 py-0.5 rounded-full border sm:border-none">0 citas</span>
            </div>

            <!-- Filtros Integrados Justo Arriba de la Tabla -->
            <div class="bg-slate-50 p-2.5 sm:p-3 rounded-md border border-slate-200 mb-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Filtrar por Médico</label>
                    <select id="filtroDoctor" onchange="aplicarFiltros()" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs bg-white">
                        <option value="">Todos los médicos</option>
                        <option value="Dr. Reyes">Dr. Reyes</option>
                        <option value="Dra. Molina">Dra. Molina</option>
                        <option value="Dr. Gonzalez">Dr. Gonzalez</option>
                        <option value="Dr. Avalos">Dr. Avalos</option>
                        <option value="Dr. Hurtarte">Dr. Hurtarte</option>
                        <option value="Dra. Flores">Dra. Flores</option>
                        <option value="Dr. Mendoza">Dr. Mendoza</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Filtrar por Fecha</label>
                    <input type="date" id="filtroFecha" onchange="aplicarFiltros()" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs bg-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Buscar por N° Registro</label>
                    <input type="text" id="filtroRegistro" oninput="aplicarFiltros()" placeholder="Ej. 40093-2026" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs uppercase bg-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">Buscar Paciente</label>
                    <input type="text" id="filtroPaciente" oninput="aplicarFiltros()" placeholder="Nombre..." class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs uppercase bg-white">
                </div>
                <div class="sm:col-span-2 md:col-span-4 flex justify-end">
                    <button type="button" onclick="limpiarFiltros()" class="text-[11px] bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 px-3 py-1 rounded font-medium shadow-sm">
                        🧹 Limpiar Filtros
                    </button>
                </div>
            </div>

            <!-- Tabla con Scroll Interno Controlado -->
            <div class="max-h-[380px] overflow-y-auto pr-1">
                <table class="w-full text-left border-collapse text-xs tabla-responsive">
                    <thead class="sticky top-0 bg-slate-50 z-10">
                        <tr class="border-b text-slate-600 uppercase font-semibold text-[10px]">
                            <th class="p-2 bg-slate-50">FECHA</th>
                            <th class="p-2 bg-slate-50">PACIENTE</th>
                            <th class="p-2 bg-slate-50">DUI / TEL.</th>
                            <th class="p-2 bg-slate-50">REGISTRO</th>
                            <th class="p-2 bg-slate-50">DOCTOR</th>
                            <th class="p-2 bg-slate-50">ESTADO</th>
                            <th class="p-2 bg-slate-50 text-center">ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCitas">
                        <tr>
                            <td colspan="7" class="p-3 text-center text-slate-400 italic bg-white rounded">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDuixL3_4MSVbVLorKtepRq2kCb1AUfeUM",
        authDomain: "agendamedica-865ad.firebaseapp.com",
        projectId: "agendamedica-865ad",
        storageBucket: "agendamedica-865ad.firebasestorage.app",
        messagingSenderId: "172417681026",
        appId: "1:172417681026:web:465a936a7fcff46d41d69b",
        measurementId: "G-RXBD9KR3GV"
      };

      let db;
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        document.getElementById("statusBadge").className = "text-[11px] bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-medium";
        document.getElementById("statusBadge").innerText = "Firebase Conectado";
        cargarCitas();
      } catch (e) {
        document.getElementById("statusBadge").className = "text-[11px] bg-red-100 text-red-800 px-2.5 py-0.5 rounded-full font-medium";
        document.getElementById("statusBadge").innerText = "Error de Conexión";
      }

      document.getElementById('paciente').addEventListener('input', (e) => e.target.value = e.target.value.toUpperCase());
      document.getElementById('dui').addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, ''); 
        if (val.length > 8) val = val.substring(0, 8) + '-' + val.substring(8, 9);
        e.target.value = val;
      });
      document.getElementById('telefono').addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, ''); 
        if (val.length > 8) val = val.substring(0, 8);
        e.target.value = val;
      });
      document.getElementById('registro').addEventListener('input', (e) => {
        let val = e.target.value.replace(/[^a-zA-Z0-9]/g, ''); 
        if (val.length > 4) val = val.substring(0, val.length - 4) + '-' + val.substring(val.length - 4);
        e.target.value = val.toUpperCase();
      });

      const asuetosFijosSV = ["01-01", "05-01", "05-10", "06-17", "08-01", "08-02", "08-03", "08-04", "08-05", "08-06", "09-15", "11-02", "12-25"];

      function esSemanaSanta(year, month, day) {
        const a = year % 19, b = Math.floor(year / 100), c = year % 100;
        const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
        const mesPascua = Math.floor((h + l - 7 * m + 114) / 31), diaPascua = ((h + l - 7 * m + 114) % 31) + 1;
        const pascua = new Date(year, mesPascua - 1, diaPascua);
        const juevesSanto = new Date(pascua); juevesSanto.setDate(pascua.getDate() - 3);
        const viernesSanto = new Date(pascua); viernesSanto.setDate(pascua.getDate() - 2);
        const fechaEval = new Date(year, month - 1, day);
        return fechaEval.toDateString() === juevesSanto.toDateString() || fechaEval.toDateString() === viernesSanto.toDateString();
      }

      const inputFecha = document.getElementById('fecha');
      const selectDoctor = document.getElementById('doctor');
      const msgFecha = document.getElementById('msgFecha');
      const btnGuardar = document.getElementById('btnGuardar');

      function validarDisponibilidad() {
        if (!inputFecha.value) return;
        const partes = inputFecha.value.split('-');
        const anio = parseInt(partes[0]), mes = parseInt(partes[1]), dia = parseInt(partes[2]);
        const fechaSeleccionada = new Date(anio, mes - 1, dia);
        const diaSemana = fechaSeleccionada.getDay();
        const mesDia = `${partes[1]}-${partes[2]}`;

        // Asignación automática del año oculto
        document.getElementById('anio').value = anio.toString();

        if (diaSemana === 0 || diaSemana === 6) {
          msgFecha.innerHTML = "❌ Sábado y Domingo NO se asignan citas.";
          msgFecha.className = "text-[10px] mt-0.5 font-semibold text-red-600 block";
          btnGuardar.disabled = true;
          btnGuardar.classList.add('opacity-50', 'cursor-not-allowed');
          return;
        }

        if (asuetosFijosSV.includes(mesDia) || esSemanaSanta(anio, mes, dia)) {
          msgFecha.innerHTML = "⚠️ Asueto o Vacación Oficial en El Salvador.";
          msgFecha.className = "text-[10px] mt-0.5 font-semibold text-amber-600 block";
          btnGuardar.disabled = false;
          btnGuardar.classList.remove('opacity-50', 'cursor-not-allowed');
          return;
        }

        msgFecha.innerHTML = "✅ Fecha disponible para agendar cita.";
        msgFecha.className = "text-[10px] mt-0.5 font-semibold text-emerald-600 block";
        btnGuardar.disabled = false;
        btnGuardar.classList.remove('opacity-50', 'cursor-not-allowed');
      }

      inputFecha.addEventListener('change', validarDisponibilidad);

      const form = document.getElementById('citaForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!db) return alert("Base de datos no conectada.");

        const editId = document.getElementById('editId').value;
        const datosCita = {
          paciente: document.getElementById('paciente').value.trim().toUpperCase(),
          dui: document.getElementById('dui').value,
          telefono: document.getElementById('telefono').value,
          registro: document.getElementById('registro').value,
          doctor: selectDoctor.value,
          fecha: inputFecha.value,
          anio: document.getElementById('anio').value,
          estado: document.getElementById('estado').value
        };

        try {
          if (editId) {
            await updateDoc(doc(db, "citas", editId), datosCita);
            cancelarEdicion();
          } else {
            datosCita.creadoEn = new Date();
            await addDoc(collection(db, "citas"), datosCita);
            form.reset();
            msgFecha.className = "hidden";
            document.getElementById('anio').value = "2026";
          }
        } catch (error) {
          alert("Error: " + error.message);
        }
      });

      let todasLasCitas = [];
      let citasCache = {};

      function cargarCitas() {
        onSnapshot(collection(db, "citas"), (snapshot) => {
          todasLasCitas = [];
          citasCache = {};
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            data.id = docSnap.id;
            todasLasCitas.push(data);
            citasCache[docSnap.id] = data;
          });
          aplicarFiltros();
        });
      }

      window.aplicarFiltros = () => {
        const docFiltro = document.getElementById('filtroDoctor').value;
        const fechaFiltro = document.getElementById('filtroFecha').value;
        const regFiltro = document.getElementById('filtroRegistro').value.trim().toUpperCase();
        const pacFiltro = document.getElementById('filtroPaciente').value.trim().toUpperCase();

        const citasFiltradas = todasLasCitas.filter(cita => {
          const coincideDoc = !docFiltro || cita.doctor === docFiltro;
          const coincideFecha = !fechaFiltro || cita.fecha === fechaFiltro;
          const coincideReg = !regFiltro || (cita.registro && cita.registro.toUpperCase().includes(regFiltro));
          const coincidePac = !pacFiltro || (cita.paciente && cita.paciente.toUpperCase().includes(pacFiltro));
          return coincideDoc && coincideFecha && coincideReg && coincidePac;
        });

        renderizarTabla(citasFiltradas);
      };

      function formatearFechaLatina(fechaISO) {
        if (!fechaISO) return '';
        const partes = fechaISO.split('-');
        if (partes.length !== 3) return fechaISO;
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      }

      function renderizarTabla(citas) {
        const tabla = document.getElementById('tablaCitas');
        const contador = document.getElementById('contadorCitas');
        tabla.innerHTML = '';
        contador.innerText = `${citas.length} cita(s)`;

        if (citas.length === 0) {
          tabla.innerHTML = `<tr><td colspan="7" class="p-3 text-center text-slate-400 italic bg-white rounded">No se encontraron citas.</td></tr>`;
          return;
        }

        citas.forEach((data) => {
          const tr = document.createElement('tr');
          tr.className = "border-b hover:bg-slate-50 text-slate-700 bg-white sm:bg-transparent";

          let estadoColor = "bg-amber-100 text-amber-800";
          if (data.estado === "Atendido") estadoColor = "bg-emerald-100 text-emerald-800";
          if (data.estado === "Agendado") estadoColor = "bg-blue-100 text-blue-800";

          const fechaFormateada = formatearFechaLatina(data.fecha);

          tr.innerHTML = `
            <td data-label="Fecha" class="p-2"><span class="font-medium">${fechaFormateada}</span></td>
            <td data-label="Paciente" class="p-2 font-semibold uppercase text-slate-800">${data.paciente || ''}</td>
            <td data-label="DUI / Tel" class="p-2 text-[11px] text-slate-500">${data.dui || '-'}<br class="hidden sm:inline">${data.telefono ? ' Tel: ' + data.telefono : ''}</td>
            <td data-label="Registro" class="p-2 text-[11px] font-mono font-bold">${data.registro || '-'}</td>
            <td data-label="Doctor" class="p-2 font-normal text-slate-800">${data.doctor || ''}</td>
            <td data-label="Estado" class="p-2"><span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${estadoColor}">${data.estado || 'Agendado'}</span></td>
            <td class="p-2 text-center space-x-1.5 td-acciones">
              <button onclick="prepararEdicion('${data.id}')" class="text-[11px] bg-amber-50 text-amber-700 hover:bg-amber-100 px-2.5 py-1 rounded font-medium border border-amber-200/50">Editar</button>
              <button onclick="eliminarCita('${data.id}')" class="text-[11px] bg-red-50 text-red-600 hover:bg-red-100 px-2.5 py-1 rounded font-medium border border-red-200/50">Eliminar</button>
            </td>
          `;
          tabla.appendChild(tr);
        });
      }

      window.limpiarFiltros = () => {
        document.getElementById('filtroDoctor').value = "";
        document.getElementById('filtroFecha').value = "";
        document.getElementById('filtroRegistro').value = "";
        document.getElementById('filtroPaciente').value = "";
        aplicarFiltros();
      };

      window.prepararEdicion = (id) => {
        const cita = citasCache[id];
        if (!cita) return;
        document.getElementById('editId').value = id;
        document.getElementById('paciente').value = cita.paciente || '';
        document.getElementById('dui').value = cita.dui || '';
        document.getElementById('telefono').value = cita.telefono || '';
        document.getElementById('registro').value = cita.registro || '';
        selectDoctor.value = cita.doctor || '';
        inputFecha.value = cita.fecha || '';
        document.getElementById('anio').value = cita.anio || '2026';
        document.getElementById('estado').value = cita.estado || 'Agendado';

        document.getElementById('formTitulo').innerText = "Editar Cita Médica";
        document.getElementById('btnGuardar').innerText = "Actualizar Cita";
        document.getElementById('btnGuardar').className = "w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2 px-3 rounded text-xs transition duration-200 active:scale-[0.99]";
        document.getElementById('btnCancelarEdicion').classList.remove('hidden');
        validarDisponibilidad();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      window.cancelarEdicion = () => {
        form.reset();
        document.getElementById('editId').value = "";
        document.getElementById('formTitulo').innerText = "Agendar Nueva Cita";
        document.getElementById('btnGuardar').innerText = "Guardar Cita";
        document.getElementById('btnGuardar').className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 rounded text-xs transition duration-200 active:scale-[0.99]";
        document.getElementById('btnCancelarEdicion').classList.add('hidden');
        msgFecha.className = "hidden";
        document.getElementById('anio').value = "2026";
      };

      window.eliminarCita = async (id) => {
        if (confirm("¿Deseas eliminar este registro de cita?")) {
          await deleteDoc(doc(db, "citas", id));
        }
      };
    </script>
</body>
</html>
