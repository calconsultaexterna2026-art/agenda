<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas - Consulta Externa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @media print {
            /* Ocultar formulario lateral, botones de acción y elementos innecesarios al imprimir */
            form, .btn-acciones, .sidebar-form, .navbar-toggler, .btn, hr {
                display: none !important;
            }
            /* Ajustar la tabla al 100% de la hoja */
            .container-fluid, .card, .table-responsive {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
            }
            body {
                background-color: white !important;
            }
        }
    </style>
</head>
<body class="bg-light">

    <!-- Barra Superior -->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="fas fa-calendar-alt me-2"></i> Sistema de Citas</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            
            <!-- Columna Izquierda: Formulario -->
            <div class="col-md-4 sidebar-form mb-4">
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="text-primary mb-3"><i class="fas fa-user-plus me-1"></i> Consulta Externa CAL</h5>
                    <form id="formCita">
                        <div class="mb-3">
                            <label class="form-label font-monospace small">Nombre del Paciente</label>
                            <input type="text" class="form-control" id="nombrePaciente" required oninput="this.value = this.value.toUpperCase()">
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-monospace small">DUI</label>
                            <input type="text" class="form-control" id="duiPaciente" placeholder="00000000-0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-monospace small">Teléfono</label>
                            <input type="text" class="form-control" id="telefonoPaciente" placeholder="70000000" maxlength="8">
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-monospace small">N° de Registro</label>
                            <input type="text" class="form-control" id="registroPaciente">
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-monospace small">Institución / Procedencia (Opcional)</label>
                            <select class="form-select" id="institucionPaciente">
                                <option value="">Ninguna / Seleccionar...</option>
                                <option value="ISBM">ISBM</option>
                                <option value="FONAT">FONAT</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-monospace small">Seleccionar Médico</label>
                            <select class="form-select" id="medicoPaciente">
                                <option value="">Elija especialista...</option>
                                <option value="Dr. Ávalos">Dr. Ávalos</option>
                                <option value="Dr. Mendoza">Dr. Mendoza</option>
                                <option value="Dra. Molina">Dra. Molina</option>
                                <option value="Dr. Reyes">Dr. Reyes</option>
                                <option value="Dr. González">Dr. González</option>
                                <option value="Dra. Flores">Dra. Flores</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-monospace small">Fecha de la Cita</label>
                            <input type="date" class="form-control" id="fechaCita">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 shadow-sm">
                            <i class="fas fa-save me-1"></i> Guardar Cita
                        </button>
                    </form>
                </div>
            </div>

            <!-- Columna Derecha: Tabla y Botones de Impresión/Descarga -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-3">
                    
                    <!-- ENCABEZADO DE LA TABLA CON LOS NUEVOS BOTONES -->
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h5 class="text-secondary m-0"><i class="fas fa-list-alt me-1"></i> Agenda de Pacientes</h5>
                        
                        <!-- BOTONES AGREGADOS -->
                        <div class="d-flex gap-2">
                            <button onclick="window.print()" class="btn btn-outline-secondary btn-sm shadow-sm">
                                <i class="fas fa-print me-1"></i> Imprimir
                            </button>
                            <button onclick="exportarExcel()" class="btn btn-outline-success btn-sm shadow-sm">
                                <i class="fas fa-file-excel me-1"></i> Descargar Excel
                            </button>
                        </div>
                    </div>

                    <!-- Filtros Rápidos -->
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control form-control-sm" placeholder="Buscar / DUI">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select form-select-sm">
                                <option>Todas las Instituciones</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select form-select-sm">
                                <option>Todos los Médicos</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="date" class="form-control form-control-sm">
                        </div>
                    </div>

                    <!-- Tabla Principal -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="tablaAgenda">
                            <thead class="table-light">
                                <tr>
                                    <th>Paciente</th>
                                    <th>DUI</th>
                                    <th>Institución</th>
                                    <th>Teléfono</th>
                                    <th>Registro</th>
                                    <th>Médico</th>
                                    <th>Fecha</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>CARLOS ALFREDO GONZALES</strong></td>
                                    <td>02043239-6</td>
                                    <td>-</td>
                                    <td>75841238</td>
                                    <td>72728828-2026</td>
                                    <td>Dr. Ávalos</td>
                                    <td>31/07/2026</td>
                                    <td class="text-center">
                                        <button class="btn btn-sm btn-outline-primary py-0 px-1"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-sm btn-outline-danger py-0 px-1"><i class="fas fa-trash-alt"></i></button>
                                    </td>
                                </tr>
                                <tr>
                                    <td><strong>CARLOS ANTONIO AGUILAR</strong></td>
                                    <td>02043985-5</td>
                                    <td><span class="badge bg-info text-dark">ISBM</span></td>
                                    <td>70014360</td>
                                    <td>88484848-2026</td>
                                    <td>Dr. Mendoza</td>
                                    <td>31/07/2026</td>
                                    <td class="text-center">
                                        <button class="btn btn-sm btn-outline-primary py-0 px-1"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-sm btn-outline-danger py-0 px-1"><i class="fas fa-trash-alt"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Script de Exportación a Excel -->
    <script>
        function exportarExcel() {
            let tabla = document.getElementById("tablaAgenda");
            let html = tabla.outerHTML;
            
            // Crear enlace temporal de descarga en formato XLS
            let url = 'data:application/vnd.ms-excel;charset=utf-8,' + encodeURIComponent(html);
            let a = document.createElement('a');
            
            a.href = url;
            a.download = 'Agenda_Pacientes_' + new Date().toISOString().slice(0,10) + '.xls';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
