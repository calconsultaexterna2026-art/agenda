<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Médica - Control de Citas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --sidebar-bg: #0f172a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            color: white;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-shrink: 0;
        }

        .logo-container {
            font-size: 15px;
            font-weight: 800;
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav-menu { display: flex; flex-direction: column; gap: 8px; }

        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-radius: 10px; font-size: 14px;
            font-weight: 500; color: #94a3b8; cursor: pointer; transition: all 0.2s;
        }

        .nav-item.active { background: var(--primary); color: white; font-weight: 600; }
        .nav-item:hover:not(.active) { background: rgba(255, 255, 255, 0.05); color: #f1f5f9; }

        .cloud-badge {
            margin-top: auto; padding: 10px; border-radius: 8px;
            background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981; font-size: 11px; text-align: center; font-weight: 700;
        }

        .main-wrapper { flex: 1; padding: 20px 16px; overflow-x: hidden; width: 100%; }

        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }
        .top-header h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.3; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--card-bg); border-radius: 16px; padding: 18px;
            border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 16px;
        }

        .form-section-title {
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--primary); margin-bottom: 14px; display: block;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: span 2; }

        label { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        input, select, textarea {
            padding: 10px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 13px; outline: none; background: #f8fafc; font-weight: 600;
            width: 100%; font-family: 'Inter', sans-serif;
        }

        .table-responsive { width: 100%; overflow-x: auto; max-height: 480px; overflow-y: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 9px 10px; font-size: 11px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
        .data-table th { background: #f8fafc; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 10px; white-space: nowrap; position: sticky; top: 0; }

        .action-btns { display: flex; gap: 8px; margin-top: 16px; }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 4px 8px; font-size: 10px; border-radius: 6px; }

        .search-box { margin-bottom: 14px; display: flex; gap: 8px; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-size: 12px; }

        .badge-isbm { font-weight: 700; color: #0284c7; background: #e0f2fe; padding: 3px 6px; border-radius: 6px; display: inline-block; }
        .badge-fonat { font-weight: 700; color: #d97706; background: #fef3c7; padding: 3px 6px; border-radius: 6px; display: inline-block; }

        @media (max-width: 768px) {
            body { flex-direction: column; padding-bottom: 80px; }
            .sidebar {
                position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: 65px;
                flex-direction: row; padding: 6px 12px; justify-content: space-around;
                align-items: center; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.1);
                background: #090d16;
            }
            .logo-container, .cloud-badge { display: none; }
            .nav-menu { flex-direction: row; width: 100%; justify-content: space-around; gap: 0; }
            .nav-item { flex-direction: column; font-size: 10px; padding: 6px 8px; gap: 3px; text-align: center; border-radius: 8px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo-container">Agenda Médica</div>
    <div class="nav-menu">
        <div class="nav-item active" onclick="switchTab('nueva-cita', this)">
            <span>➕</span><span>Agendar Cita</span>
        </div>
        <div class="nav-item" onclick="switchTab('historial-citas', this)">
            <span>📋</span><span>Consultar Agenda</span>
        </div>
    </div>
    <div class="cloud-badge">☁️ Sincronizado</div>
</div>

<div class="main-wrapper">
    
    <!-- TAB 1: NUEVA CITA -->
    <div id="nueva-cita" class="tab-content active">
        <div class="top-header">
            <div>
                <h1>REGISTRAR NUEVA CITA MÉDICA</h1>
            </div>
        </div>

        <div class="card" style="max-width: 700px; margin: 0 auto;">
            <span class="form-section-title" id="form-title-label">DATOS DEL PACIENTE Y CITA</span>
            <input type="hidden" id="edit-id" value="">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Nombre del Paciente</label>
                    <input type="text" id="cita-paciente" placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label>Doctor Asignado</label>
                    <select id="cita-doctor">
                        <option value="Dr. 1">Dr. 1</option>
                        <option value="Dr. 2">Dr. 2</option>
                        <option value="Dr. 3">Dr. 3</option>
                        <option value="Dr. 4">Dr. 4</option>
                        <option value="Dr. 5">Dr. 5</option>
                        <option value="Dr. 6">Dr. 6</option>
                        <option value="Dr. 7">Dr. 7</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Institución</label>
                    <select id="cita-institucion">
                        <option value="ISBM">ISBM</option>
                        <option value="FONAT">FONAT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha de la Cita</label>
                    <input type="date" id="cita-fecha">
                </div>
                <div class="form-group">
                    <label>Hora</label>
                    <input type="time" id="cita-hora">
                </div>
            </div>
            <div class="action-btns">
                <button class="btn btn-primary" style="width: 100%;" id="btn-guardar-actualizar" onclick="guardarCita()">💾 Guardar Cita</button>
                <button class="btn btn-danger" style="display: none;" id="btn-cancelar-edicion" onclick="limpiarFormulario()">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- TAB 2: CONSULTAR AGENDA -->
    <div id="historial-citas" class="tab-content">
        <div class="top-header">
            <div>
                <h1>AGENDA DE PACIENTES</h1>
                <p>Control por paciente, doctor o institución</p>
            </div>
        </div>

        <div class="card">
            <div class="search-box">
                <input type="text" id="input-busqueda" placeholder="🔍 Buscar por paciente, doctor o fecha..." oninput="filtrarCitas()">
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>Doctor</th>
                            <th>Institución</th>
                            <th>Fecha y Hora</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-citas"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDJnpVBknIaxZpnA7Mp_drKtU_K5beCeKw",
        authDomain: "imporsalv-935e2.firebaseapp.com",
        projectId: "imporsalv-935e2",
        storageBucket: "imporsalv-935e2.firebasestorage.app",
        messagingSenderId: "464657083645",
        appId: "1:464657083645:web:d968f41e7dd3cd1c9be294"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let listaCitas = [];

    db.collection('agenda_medica').orderBy('fecha', 'asc').onSnapshot(snapshot => {
        listaCitas = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderizarTabla(listaCitas);
    });

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(element) element.classList.add('active');
    }

    function guardarCita() {
        let editId = document.getElementById('edit-id').value;
        let paciente = document.getElementById('cita-paciente').value.trim();
        let doctor = document.getElementById('cita-doctor').value;
        let institucion = document.getElementById('cita-institucion').value;
        let fecha = document.getElementById('cita-fecha').value;
        let hora = document.getElementById('cita-hora').value;

        if(!paciente || !fecha || !hora) {
            alert('Por favor complete los campos obligatorios.');
            return;
        }

        let data = {
            paciente: paciente.toUpperCase(),
            doctor,
            institucion,
            fecha,
            hora,
            timestamp: Date.now()
        };

        if(editId) {
            db.collection('agenda_medica').doc(editId).update(data).then(() => {
                alert('✅ Cita actualizada correctamente');
                limpiarFormulario();
                switchTab('historial-citas', document.querySelectorAll('.nav-item')[1]);
            });
        } else {
            db.collection('agenda_medica').add(data).then(() => {
                alert('✅ Cita agendada correctamente');
                limpiarFormulario();
                switchTab('historial-citas', document.querySelectorAll('.nav-item')[1]);
            });
        }
    }

    function renderizarTabla(citas) {
        let tbody = document.getElementById('tabla-citas');
        if(citas.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No hay citas registradas.</td></tr>`;
            return;
        }

        tbody.innerHTML = citas.map(item => {
            let institucionClase = item.institucion === 'FONAT' ? 'badge-fonat' : 'badge-isbm';
            let instTexto = item.institucion || 'ISBM';

            return `
                <tr>
                    <td><strong>${item.paciente}</strong></td>
                    <td>${item.doctor}</td>
                    <td><span class="${institucionClase}">${instTexto}</span></td>
                    <td>${item.fecha} - ${item.hora}</td>
                    <td>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <button class="btn btn-warning btn-sm" onclick="cargarEdicion('${item.id}')" type="button">✏️ Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="borrarCita('${item.id}')" type="button">🗑️ Borrar</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function filtrarCitas() {
        let texto = document.getElementById('input-busqueda').value.toLowerCase();
        let filtradas = listaCitas.filter(item => {
            return (item.paciente && item.paciente.toLowerCase().includes(texto)) ||
                   (item.doctor && item.doctor.toLowerCase().includes(texto)) ||
                   (item.institucion && item.institucion.toLowerCase().includes(texto)) ||
                   (item.fecha && item.fecha.includes(texto));
        });
        renderizarTabla(filtradas);
    }

    function cargarEdicion(id) {
        let item = listaCitas.find(l => l.id === id);
        if(!item) return;

        document.getElementById('edit-id').value = item.id;
        document.getElementById('cita-paciente').value = item.paciente;
        document.getElementById('cita-doctor').value = item.doctor || 'Dr. 1';
        document.getElementById('cita-institucion').value = item.institucion || 'ISBM';
        document.getElementById('cita-fecha').value = item.fecha;
        document.getElementById('cita-hora').value = item.hora;

        document.getElementById('form-title-label').innerText = 'EDITAR CITA MÉDICA';
        document.getElementById('btn-guardar-actualizar').innerText = '💾 Actualizar Cita';
        document.getElementById('btn-cancelar-edicion').style.display = 'inline-flex';

        switchTab('nueva-cita', document.querySelectorAll('.nav-item')[0]);
    }

    function limpiarFormulario() {
        document.getElementById('edit-id').value = '';
        document.getElementById('cita-paciente').value = '';
        document.getElementById('cita-doctor').value = 'Dr. 1';
        document.getElementById('cita-institucion').value = 'ISBM';
        document.getElementById('cita-fecha').value = '';
        document.getElementById('cita-hora').value = '';

        document.getElementById('form-title-label').innerText = 'DATOS DEL PACIENTE Y CITA';
        document.getElementById('btn-guardar-actualizar').innerText = '💾 Guardar Cita';
        document.getElementById('btn-cancelar-edicion').style.display = 'none';
    }

    function borrarCita(id) {
        if(confirm('¿Deseas eliminar esta cita de la agenda?')) {
            db.collection('agenda_medica').doc(id).delete();
        }
    }
</script>
</body>
</html>
