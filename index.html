<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Estilos Personalizados -->
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            background-color: #ffffff;
            border-bottom: 1px solid #edf2f7;
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            font-weight: 600;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 10px;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 12px;
            border: 1px solid #ced4da;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .table-responsive {
            border-radius: 8px;
            overflow: hidden;
        }
        .table thead th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-calendar-check me-2"></i> Sistema de Citas
            </a>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container-fluid px-4">
        <div class="row g-4">
            
            <!-- Columna Izquierda: Formulario de Registro -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header py-3 text-primary">
                        <i class="fa-solid fa-user-plus me-2"></i> Nueva Cita
                    </div>
                    <div class="card-body">
                        <form id="formCita">
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Nombre del Paciente</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" class="form-control" id="txtNombre" placeholder="Ej. JUAN PÉREZ" style="text-transform: uppercase;" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">DUI</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-id-card text-muted"></i></span>
                                    <input type="text" class="form-control" id="txtDui" placeholder="00000000-0" maxlength="10" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Teléfono</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-muted"></i></span>
                                    <input type="tel" class="form-control" id="txtTelefono" placeholder="70000000" maxlength="8" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">N° de Registro</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-file-medical text-muted"></i></span>
                                    <input type="text" class="form-control" id="txtRegistro" placeholder="REG-2026" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Seleccionar Médico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user-doctor text-muted"></i></span>
                                    <select class="form-select" id="cmbMedicos" required>
                                        <option value="" selected disabled>Elija un especialista...</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold">Fecha de la Cita (Calendario)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-calendar-days text-muted"></i></span>
                                    <input type="date" class="form-control" id="dateCita" required>
                                </div>
                                <div class="form-text text-muted small">No disponible fines de semana ni días asuetos.</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                                <i class="fa-solid fa-floppy-disk me-2"></i> Guardar Cita
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Filtros y Tabla de Pacientes Agendados -->
            <div class="col-lg-8">
                <div class="card h-100">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center text-primary">
                        <span><i class="fa-solid fa-clipboard-list me-2"></i> Agenda de Pacientes</span>
                    </div>
                    <div class="card-body">
                        
                        <!-- Panel de Filtros de Búsqueda -->
                        <div class="row g-3 mb-4 p-3 bg-light rounded-3 border">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Buscar Paciente / DUI</label>
                                <input type="text" class="form-control" id="txtBuscar" placeholder="Escribe para buscar...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Filtrar por Médico</label>
                                <select class="form-select" id="cmbFiltroMedico">
                                    <option value="">Todos los médicos</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Filtrar por Fecha</label>
                                <input type="date" class="form-control" id="dateFiltro">
                            </div>
                        </div>

                        <!-- Tabla de Datos -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Paciente</th>
                                        <th>DUI</th>
                                        <th>Teléfono</th>
                                        <th>Registro</th>
                                        <th>Médico</th>
                                        <th>Fecha</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaCitasBody">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted py-4">No hay citas registradas aún.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de Lógica e Interactividad -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const medicosLista = [
                "Dr. Ávalos",
                "Dr. González",
                "Dr. Reyes",
                "Dr. Mendoza",
                "Dr. Hurtarte",
                "Dra. Molina",
                "Dra. Flores"
            ];

            let citas = [];

            const formCita = document.getElementById('formCita');
            const cmbMedicos = document.getElementById('cmbMedicos');
            const cmbFiltroMedico = document.getElementById('cmbFiltroMedico');
            const tablaCitasBody = document.getElementById('tablaCitasBody');
            
            const txtNombre = document.getElementById('txtNombre');
            const txtDui = document.getElementById('txtDui');
            const txtTelefono = document.getElementById('txtTelefono');
            const txtRegistro = document.getElementById('txtRegistro');
            const dateCita = document.getElementById('dateCita');
            
            const txtBuscar = document.getElementById('txtBuscar');
            const dateFiltro = document.getElementById('dateFiltro');

            // Forzar mayúsculas en tiempo real al escribir el nombre
            txtNombre.addEventListener('input', (e) => {
                e.target.value = e.target.value.toUpperCase();
            });

            // Autoformato del DUI: coloca el guion automáticamente antes del último dígito
            txtDui.addEventListener('input', (e) => {
                let val = e.target.value.replace(/[^0-9]/g, '');
                if (val.length > 8) {
                    val = val.slice(0, 8) + '-' + val.slice(8, 9);
                }
                e.target.value = val;
            });

            // Teléfono solo números (máximo 8 dígitos)
            txtTelefono.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 8);
            });

            // Asuetos fijos nacionales en El Salvador (Mes-Día)
            const asuetosFijos = [
                "01-01", // Año Nuevo
                "05-01", // Día del Trabajo
                "05-10", // Día de la Madre
                "06-17", // Día del Padre
                "08-05", // Fiestas Agostinas
                "08-06", // Fiestas Agostinas
                "09-15", // Día de la Independencia
                "11-02", // Día de los Difuntos
                "12-25"  // Navidad
            ];

            function esDiaInhabil(fechaStr) {
                if (!fechaStr) return false;
                const partes = fechaStr.split('-');
                const mesDia = `${partes[1]}-${partes[2]}`;
                
                const fecha = new Date(fechaStr + 'T00:00:00');
                const diaSemana = fecha.getDay(); // 0 = Domingo, 6 = Sábado

                if (diaSemana === 0 || diaSemana === 6) return true;
                if (asuetosFijos.includes(mesDia)) return true;

                return false;
            }

            dateCita.addEventListener('change', () => {
                const fechaSeleccionada = dateCita.value;
                if (esDiaInhabil(fechaSeleccionada)) {
                    alert('⚠️ No se pueden agendar citas en fines de semana o días asuetos nacionales.');
                    dateCita.value = '';
                }
            });

            function inicializarSelectsMedicos() {
                medicosLista.forEach(medico => {
                    const opt1 = document.createElement('option');
                    opt1.value = medico;
                    opt1.textContent = medico;
                    cmbMedicos.appendChild(opt1);

                    const opt2 = document.createElement('option');
                    opt2.value = medico;
                    opt2.textContent = medico;
                    cmbFiltroMedico.appendChild(opt2);
                });
            }

            function renderizarTabla(datosAMostrar = citas) {
                tablaCitasBody.innerHTML = '';

                if (datosAMostrar.length === 0) {
                    tablaCitasBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">No se encontraron registros de citas.</td>
                        </tr>`;
                    return;
                }

                datosAMostrar.forEach(cita => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td class="fw-semibold text-dark">${cita.nombre}</td>
                        <td>${cita.dui}</td>
                        <td>${cita.telefono}</td>
                        <td><span class="badge bg-light text-dark border">${cita.registro}</span></td>
                        <td><span class="badge bg-primary bg-opacity-10 text-primary px-2 py-1">${cita.medico}</span></td>
                        <td>${cita.fecha}</td>
                    `;
                    tablaCitasBody.appendChild(fila);
                });
            }

            formCita.addEventListener('submit', (e) => {
                e.preventDefault();

                const nombreVal = txtNombre.value.trim();
                const duiVal = txtDui.value.trim();
                const telVal = txtTelefono.value.trim();
                const regVal = txtRegistro.value.trim();
                const fechaVal = dateCita.value;

                const regexDui = /^\d{8}-\d{1}$/;
                if (!regexDui.test(duiVal)) {
                    alert('El DUI debe contener exactamente 8 dígitos, un guion y 1 dígito verificador (Ej: 02043231-6).');
                    txtDui.focus();
                    return;
                }

                if (telVal.length !== 8) {
                    alert('El teléfono debe contener exactamente 8 dígitos.');
                    txtTelefono.focus();
                    return;
                }

                if (esDiaInhabil(fechaVal)) {
                    alert('La fecha seleccionada corresponde a un fin de semana o día asueto. No se puede guardar la cita.');
                    return;
                }

                const nuevaCita = {
                    nombre: nombreVal,
                    dui: duiVal,
                    telefono: telVal,
                    registro: regVal,
                    medico: cmbMedicos.value,
                    fecha: fechaVal
                };

                citas.push(nuevaCita);
                renderizarTabla();
                
                txtNombre.value = '';
                txtDui.value = '';
                txtTelefono.value = '';
                txtRegistro.value = '';
                cmbMedicos.value = '';
                dateCita.value = '';

                alert('¡Cita guardada y agendada exitosamente!');
            });

            function aplicarFiltros() {
                const textoBusqueda = txtBuscar.value.toLowerCase();
                const medicoFiltro = cmbFiltroMedico.value;
                const fechaFiltro = dateFiltro.value;

                const citasFiltradas = citas.filter(cita => {
                    const coincideTexto = cita.nombre.toLowerCase().includes(textoBusqueda) || 
                                         cita.dui.toLowerCase().includes(textoBusqueda);
                    
                    const coincideMedico = medicoFiltro === "" || cita.medico === medicoFiltro;
                    const coincideFecha = fechaFiltro === "" || cita.fecha === fechaFiltro;

                    return coincideTexto && coincideMedico && coincideFecha;
                });

                renderizarTabla(citasFiltradas);
            }

            txtBuscar.addEventListener('input', aplicarFiltros);
            cmbFiltroMedico.addEventListener('change', aplicarFiltros);
            dateFiltro.addEventListener('change', aplicarFiltros);

            inicializarSelectsMedicos();
            renderizarTabla();
        });
    </script>
</body>
</html>
