<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Consulta Externa</title>
    <style>
        /* Estilos generales limpios y profesionales */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.15;
        }
        h1 {
            text-align: center;
            color: #2b6cb0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        /* Estilo del botón de impresión */
        .btn-imprimir {
            background-color: #2b6cb0; 
            color: white; 
            padding: 10px 15px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-imprimir:hover {
            background-color: #234e70;
        }

        /* CONFIGURACIÓN PARA IMPRESIÓN LIMPIA */
        @media print {
            body {
                background-color: white;
            }
            .container {
                box-shadow: none;
                padding: 0;
                margin: 0;
                max-width: 100%;
            }
            /* Oculta automáticamente los botones y controles al imprimir */
            .btn-imprimir, .controls, button {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Agenda Consulta Externa</h1>
        
        <!-- Botón de Imprimir / Guardar PDF -->
        <div class="controls">
            <button class="btn-imprimir" onclick="imprimirAgenda()">
                🖨️ Imprimir / Guardar PDF
            </button>
        </div>

        <!-- Aquí va el resto de tu contenido o tabla de la agenda existente -->
        <div id="agenda-contenido">
            <p>Tu agenda médica cargará aquí de forma habitual con Firebase...</p>
        </div>
    </div>

    <script>
        // Función para activar la ventana de impresión del navegador
        function imprimirAgenda() {
            window.print();
        }

        // Aquí va tu código de Firebase y la lógica de tus citas médicas
    </script>
</body>
</html>
